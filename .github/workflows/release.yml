name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package zip
        run: |
          mkdir -p out/metrics
          cp -r plugin.json settings.json dist README.md out/metrics/
          [ -f icon.png ] && cp icon.png out/metrics/ || true
          (cd out && zip -r ../metrics.zip metrics)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" metrics.zip --generate-notes
